[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "labo1"
authors = [
    { name="Mauro Silberberg", email="maurosilber@gmail.com" },
]
description = ""
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]
keywords = []
license = "MIT"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
version = "2.0.0"
readme = "README.md"

[project.urls]
homepage = "https://github.com/maurosilber/labo1"
issues = "https://github.com/maurosilber/labo1/issues"
documentation = "https://maurosilber.github.io/labo1"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = "."

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
typeCheckingMode = "standard"
venv = "default"
venvPath = ".pixi/envs/"

[tool.pyrefly]
python-interpreter-path = ".pixi/envs/default/bin/python"
project-excludes = [".pixi", "**/__pycache__"]

[tool.tombi]
toml-version = "v1.1.0"
