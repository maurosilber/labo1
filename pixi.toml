[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package.build]
backend = { name = "pixi-build-python", version = "*" }
config = { ignore-pypi-mapping = false }  # Enable automatic PyPI-to-conda mapping

[environments]
default = ["test", "py310", "lint", "build", "docs"]
py311 = ["test", "py311"]
py312 = ["test", "py312"]
py313 = ["test", "py313"]
py314 = ["test", "py314"]

[dependencies]
labo1 = { path = "." }

[feature]
py310.dependencies.python = "3.10.*"
py311.dependencies.python = "3.11.*"
py312.dependencies.python = "3.12.*"
py313.dependencies.python = "3.13.*"
py314.dependencies.python = "3.14.*"

[feature.lint]
dependencies = {
  prek = "*",
  tombi = "*",
  ruff = "*",
}
tasks = { lint = "prek --all-files" }

[feature.build]
dependencies = { uv = "*" }
tasks = {
  build = "uv build",
  _publish = "uv publish",
}

[feature.test]
dependencies = { pytest = "*" }
tasks = { test = "pytest --doctest-modules" }

[feature.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.31"
mkdocstrings = ">=0.25.2"
mkdocstrings-python = ">=1.10.7"
mkdocs-jupyter = ">=0.24.8"
black = ">=24.4.2"
jupyter = ">=1.0.0"
mike = ">=2.1.2"
backports = ">=1.0"
# "backports.strenum" = ">=1.3.1"

[feature.docs.tasks]
build-docs = { cmd = "mike deploy latest", inputs = ["src/", "docs/"], outputs = ["docs/"] }
serve-docs = { cmd = "mike serve", depends-on = ["build-docs"] }
